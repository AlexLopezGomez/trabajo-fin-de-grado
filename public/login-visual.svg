  <rect x="38" y="126" width="138" height="82" rx="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1"/>
  <text x="52" y="148" fill="#555" font-size="9.5" font-family="system-ui, sans-serif">Ingresos totales</text>
  <text x="52" y="178" fill="#52b370" font-size="26" font-weight="bold" font-family="system-ui, sans-serif">$2.4M</text>
  <text x="52" y="197" fill="#52b370" font-size="9.5" font-family="system-ui, sans-serif">↑ +18.2% vs anterior</text>

  <!-- Card 2 - Orders -->
  <rect x="188" y="126" width="138" height="82" rx="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1"/>
  <text x="202" y="148" fill="#555" font-size="9.5" font-family="system-ui, sans-serif">Pedidos activos</text>
  <text x="202" y="178" fill="#e8e8e8" font-size="26" font-weight="bold" font-family="system-ui, sans-serif">1,284</text>
  <text x="202" y="197" fill="#555" font-size="9.5" font-family="system-ui, sans-serif">↑ +43 este mes</text>

