<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#3d8a57" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52b370"/>
      <stop offset="100%" stop-color="#2d6a42"/>
    </linearGradient>
    <linearGradient id="barGradDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8a57"/>
      <stop offset="100%" stop-color="#1e4a2e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52b370" stop-opacity="0"/>
      <stop offset="40%" stop-color="#52b370"/>
      <stop offset="100%" stop-color="#52b370"/>
    </linearGradient>
    <clipPath id="windowClip">
