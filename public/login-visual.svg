  <rect x="338" y="126" width="144" height="82" rx="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1"/>
  <text x="352" y="148" fill="#555" font-size="9.5" font-family="system-ui, sans-serif">Conversión</text>
  <text x="352" y="178" fill="#e8e8e8" font-size="26" font-weight="bold" font-family="system-ui, sans-serif">3.7%</text>
  <text x="352" y="197" fill="#777" font-size="9.5" font-family="system-ui, sans-serif">↓ -0.3% vs anterior</text>

