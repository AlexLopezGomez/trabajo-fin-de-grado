    <line x1="0" y1="52" x2="520" y2="52"/>
    <line x1="0" y1="104" x2="520" y2="104"/>
    <line x1="0" y1="156" x2="520" y2="156"/>
    <line x1="0" y1="208" x2="520" y2="208"/>
    <line x1="0" y1="260" x2="520" y2="260"/>
    <line x1="0" y1="312" x2="520" y2="312"/>
    <line x1="0" y1="364" x2="520" y2="364"/>
    <line x1="0" y1="416" x2="520" y2="416"/>
    <line x1="0" y1="468" x2="520" y2="468"/>
    <line x1="0" y1="520" x2="520" y2="520"/>
    <line x1="0" y1="572" x2="520" y2="572"/>
    <line x1="0" y1="624" x2="520" y2="624"/>
    <line x1="0" y1="676" x2="520" y2="676"/>
    <line x1="52" y1="0" x2="52" y2="720"/>
    <line x1="104" y1="0" x2="104" y2="720"/>
    <line x1="156" y1="0" x2="156" y2="720"/>
    <line x1="208" y1="0" x2="208" y2="720"/>
    <line x1="260" y1="0" x2="260" y2="720"/>
    <line x1="312" y1="0" x2="312" y2="720"/>
    <line x1="364" y1="0" x2="364" y2="720"/>
    <line x1="416" y1="0" x2="416" y2="720"/>
    <line x1="468" y1="0" x2="468" y2="720"/>
  </g>

