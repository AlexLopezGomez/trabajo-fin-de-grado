  <text x="50" y="351" fill="#3a3a3a" font-size="8" text-anchor="end" font-family="monospace">1M</text>
  <text x="50" y="321" fill="#3a3a3a" font-size="8" text-anchor="end" font-family="monospace">1.5M</text>
  <text x="50" y="291" fill="#3a3a3a" font-size="8" text-anchor="end" font-family="monospace">2M</text>

