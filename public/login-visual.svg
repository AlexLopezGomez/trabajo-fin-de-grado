  <text x="58" y="555" fill="#333" font-size="8" font-family="monospace">Ene</text>
  <text x="100" y="555" fill="#333" font-size="8" font-family="monospace">Mar</text>
  <text x="143" y="555" fill="#333" font-size="8" font-family="monospace">Jun</text>
  <text x="187" y="555" fill="#333" font-size="8" font-family="monospace">Sep</text>

  <!-- Donut widget -->
  <rect x="262" y="448" width="220" height="118" rx="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1"/>
  <text x="278" y="470" fill="#e0e0e0" font-size="10.5" font-weight="600" font-family="system-ui, sans-serif">Por segmento</text>
  <!-- Donut circle -->
  <circle cx="318" cy="516" r="32" fill="none" stroke="#1d1d1d" stroke-width="10"/>
  <circle cx="318" cy="516" r="32" fill="none" stroke="#2d6a42" stroke-width="10" stroke-dasharray="64 137" stroke-dashoffset="0" transform="rotate(-90 318 516)"/>
  <circle cx="318" cy="516" r="32" fill="none" stroke="#52b370" stroke-width="10" stroke-dasharray="121 80" stroke-dashoffset="-64" transform="rotate(-90 318 516)"/>
  <!-- Center text -->
  <text x="318" y="519" fill="#e0e0e0" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">60%</text>
  <!-- Legend -->
  <rect x="364" y="495" width="7" height="7" rx="1.5" fill="#52b370"/>
  <text x="375" y="502" fill="#555" font-size="9" font-family="system-ui, sans-serif">Retail (60%)</text>
  <rect x="364" y="510" width="7" height="7" rx="1.5" fill="#2d6a42"/>
  <text x="375" y="517" fill="#555" font-size="9" font-family="system-ui, sans-serif">Online (25%)</text>
  <rect x="364" y="525" width="7" height="7" rx="1.5" fill="#1e1e1e"/>
  <text x="375" y="532" fill="#555" font-size="9" font-family="system-ui, sans-serif">Otros (15%)</text>

  <!-- ── AI context pill at bottom ── -->
  <rect x="38" y="582" width="444" height="36" rx="8" fill="#0d0d0d" stroke="#1e1e1e" stroke-width="1"/>
  <circle cx="56" cy="600" r="5" fill="#1a3326"/>
  <circle cx="56" cy="600" r="3" fill="#52b370"/>
  <text x="68" y="603" fill="#444" font-size="9.5" font-family="system-ui, sans-serif">Pipeline generado con GPT-4 · MongoDB aggregation · 0.8s</text>

  <!-- Bottom vignette inside window -->
  <rect x="18" y="580" width="484" height="122" rx="0" fill="url(#bottomFade)" clip-path="url(#windowClip)"/>
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
