  <!-- Area fill under sparkline -->
  <path d="M 58 540 L 58 528 L 85 515 L 112 521 L 139 504 L 166 508 L 193 490 L 220 480 L 234 480 L 234 540 Z" fill="#52b370" opacity="0.08"/>
  <!-- Sparkline -->
  <polyline points="58,528 85,515 112,521 139,504 166,508 193,490 220,480" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="220" cy="480" r="4" fill="#52b370"/>
  <circle cx="220" cy="480" r="7" fill="#52b370" opacity="0.2"/>
