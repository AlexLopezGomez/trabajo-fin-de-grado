  <text x="107" y="422" fill="#444" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Q1</text>

  <!-- Q2 bar -->
  <rect x="186" y="320" width="62" height="88" rx="4" fill="url(#barGradDim)" opacity="0.9"/>
  <text x="217" y="422" fill="#444" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Q2</text>

  <!-- Q3 bar -->
  <rect x="296" y="334" width="62" height="74" rx="4" fill="url(#barGradDim)" opacity="0.9"/>
  <text x="327" y="422" fill="#444" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Q3</text>

