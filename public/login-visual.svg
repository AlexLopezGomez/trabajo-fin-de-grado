  <rect x="18" y="18" width="484" height="38" rx="12" fill="#242424" clip-path="url(#windowClip)"/>
  <rect x="18" y="40" width="484" height="16" fill="#242424"/>
  <!-- Dots -->
  <circle cx="42" cy="37" r="5" fill="#2e2e2e"/>
  <circle cx="58" cy="37" r="5" fill="#2e2e2e"/>
  <circle cx="74" cy="37" r="5" fill="#2e2e2e"/>
  <!-- Fake URL bar -->
  <rect x="150" y="28" width="220" height="18" rx="9" fill="#1e1e1e"/>
  <text x="260" y="41" fill="#3a3a3a" font-size="9" font-family="monospace" text-anchor="middle">dashboard.app/query</text>

