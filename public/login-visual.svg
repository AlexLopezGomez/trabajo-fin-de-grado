  <line x1="54" y1="378" x2="470" y2="378" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="54" y1="348" x2="470" y2="348" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="54" y1="318" x2="470" y2="318" stroke="#1c1c1c" stroke-width="1"/>
